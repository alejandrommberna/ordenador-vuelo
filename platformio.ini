; =============================================================================
;  Ordenador de vuelo · Fase 1 (IMU + web 3D) · Heltec WiFi LoRa 32 V3
; =============================================================================
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Mete web/index.html DENTRO del firmware al compilar: no hace falta subir
; ningún sistema de archivos aparte. Editas el HTML, compilas, subes y listo.
board_build.embed_txtfiles = web/index.html

; El MPU6050 se maneja con sus registros (src/imu.cpp): no necesita librería.
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@>=2.6.8
    mikalhart/TinyGPSPlus@^1.0.3
    ESP32Async/ESPAsyncWebServer@^3.10.0
    ESP32Async/AsyncTCP@^3.4.0
